<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Folder Reveal Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="folder-reveal-cards.css"><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#12141a,#050608 70%)}.wrap{padding:24px}</style></head>
<body><div class="wrap">
  <section class="frc">
    <a class="frc-card t-violet" href="#">
      <div class="frc-art"></div>
      <div class="frc-obj"><svg viewBox="0 0 200 126"><defs>
<linearGradient id="g1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5a7cff"/><stop offset=".35" stop-color="#b48cff"/><stop offset=".65" stop-color="#9be7ff"/><stop offset="1" stop-color="#ff9de0"/></linearGradient></defs>
<path d="M28 118 L64 84 L50 70 L92 64 L138 30 L120 18 L176 8 L170 62 L156 46 L108 92 L106 112 L82 100 L44 124 Z" fill="url(#g1)" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M92 64 L138 30 L156 46 L110 88 Z" fill="rgba(255,255,255,.25)"/></svg></div>
      <div class="frc-body">
        <span class="frc-num">01</span><svg class="frc-arrow" viewBox="0 0 10 10"><path d="M2 8L8 2M3.500 2H8v4.500"/></svg>
        <div class="frc-foot"><h3 class="frc-title">Built for speed</h3><p class="frc-text">Every interaction responds before you notice the wait.</p></div>
      </div>
    </a>
    <a class="frc-card t-light" href="#">
      <div class="frc-art"></div>
      <div class="frc-obj"><svg viewBox="0 0 200 126"><defs>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#e8552e"/><stop offset="1" stop-color="#9b1d3a"/></linearGradient>
<linearGradient id="g2s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c8"/><stop offset=".5" stop-color="#b58a4a"/><stop offset="1" stop-color="#f4e2b0"/></linearGradient></defs>
<path d="M58 22 L99 30 L99 118 L58 108 Z" fill="url(#g2)" stroke="url(#g2s)" stroke-width="4" stroke-linejoin="round"/>
<path d="M141 22 L101 30 L101 118 L141 108 Z" fill="url(#g2)" stroke="url(#g2s)" stroke-width="4" stroke-linejoin="round"/>
<path d="M66 50 L92 56 M66 70 L92 76 M134 50 L108 56 M134 70 L108 76" stroke="rgba(255,240,180,.5)" stroke-width="2"/></svg></div>
      <div class="frc-body">
        <span class="frc-num">02</span><svg class="frc-arrow" viewBox="0 0 10 10"><path d="M2 8L8 2M3.500 2H8v4.500"/></svg>
        <div class="frc-foot"><h3 class="frc-title">Made to bend</h3><p class="frc-text">Reshape the layout without touching a single line of code.</p></div>
      </div>
    </a>
    <a class="frc-card t-slate" href="#">
      <div class="frc-art"></div>
      <div class="frc-obj"><svg viewBox="0 0 200 126"><defs>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe4ff"/><stop offset=".4" stop-color="#3a63b0"/><stop offset="1" stop-color="#0a1633"/></linearGradient></defs>
<g transform="translate(100 66)" fill="url(#g3)" stroke="rgba(220,235,255,.8)" stroke-width="1.2" opacity=".92">
<ellipse rx="52" ry="14" transform="rotate(-24)"/><ellipse rx="52" ry="14" transform="rotate(8)"/><ellipse rx="52" ry="14" transform="rotate(38)"/><ellipse rx="40" ry="10" transform="rotate(-58)"/></g></svg></div>
      <div class="frc-body">
        <span class="frc-num">03</span><svg class="frc-arrow" viewBox="0 0 10 10"><path d="M2 8L8 2M3.500 2H8v4.500"/></svg>
        <div class="frc-foot"><h3 class="frc-title">Room to grow</h3><p class="frc-text">Start small and scale up without ever hitting a redesign.</p></div>
      </div>
    </a>
  </section>
</div>
<script src="folder-reveal-cards.js"></script>
<script>new FolderRevealCards(document.querySelector(".frc"));</script>
</body></html>
